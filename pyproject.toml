[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-codex-image-skill"
version = "0.1.0"
description = "Public Hermes/OpenClaw-friendly Python wrapper for local Codex CLI image generation via ChatGPT/Codex login."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "techkwon"}
]
keywords = ["hermes", "codex", "image-generation", "openclaw", "oauth", "chatgpt"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/techkwon/hermes-codex-image-skill"
Repository = "https://github.com/techkwon/hermes-codex-image-skill"
Issues = "https://github.com/techkwon/hermes-codex-image-skill/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0",
  "ruff>=0.11.0",
]

[project.scripts]
hermes-codex-image = "hermes_codex_image_skill.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
hermes_codex_image_skill = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
